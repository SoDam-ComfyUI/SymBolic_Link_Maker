<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폴더 링크 명령어 생성기</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f1f5f9; color: #172033; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; background: #fff; border: 1px solid #dce3ee; border-radius: 14px; box-shadow: 0 12px 30px rgb(15 23 42 / 8%); overflow: hidden; }
    header { padding: 28px 28px 22px; background: linear-gradient(135deg, #eff6ff, #f8fafc); border-bottom: 1px solid #dce3ee; }
    h1 { margin: 0; color: #1d4ed8; font-size: clamp(1.45rem, 4vw, 2rem); }
    header p { margin: 9px 0 0; color: #475569; line-height: 1.55; }
    form, .notice, .output { padding: 22px 28px; }
    .field { margin: 0 0 20px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend, label { display: block; margin-bottom: 8px; font-weight: 700; }
    .choices { display: flex; flex-wrap: wrap; gap: 10px; }
    .choice { display: flex; align-items: flex-start; gap: 8px; flex: 1 1 210px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; cursor: pointer; }
    .choice:has(input:checked) { border-color: #2563eb; background: #eff6ff; }
    .choice input { margin: 3px 0 0; accent-color: #2563eb; }
    .choice strong, .choice small { display: block; }
    .choice small { margin-top: 3px; color: #526176; line-height: 1.35; }
    input[type="text"] { width: 100%; padding: 11px 12px; border: 1px solid #94a3b8; border-radius: 8px; color: #172033; font: inherit; }
    input[type="text"]:focus, button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .hint { margin: 7px 0 0; color: #526176; font-size: .9rem; line-height: 1.45; }
    .path-preview { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid #2563eb; border-radius: 4px; background: #eff6ff; color: #1e3a8a; font-size: .9rem; line-height: 1.45; word-break: break-all; }
    .error { min-height: 1.45em; margin: -9px 0 14px; color: #b42318; font-weight: 600; }
    button { border: 0; border-radius: 8px; padding: 11px 16px; background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .notice { border-top: 1px solid #dce3ee; background: #fffbeb; }
    .notice h2, .output h2 { margin: 0 0 10px; font-size: 1.05rem; }
    ul { margin: 0; padding-left: 20px; line-height: 1.6; }
    .output { display: none; border-top: 1px solid #dce3ee; background: #f8fafc; }
    .command-wrap { position: relative; margin: 12px 0 18px; }
    #commandDisplay { min-height: 64px; padding: 16px 112px 16px 16px; border: 2px solid #0f172a; border-radius: 8px; background: #0b0f19; color: #ffffff; font: 700 0.95rem/1.6 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-all; user-select: none !important; -webkit-user-select: none !important; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    #copyButton { position: absolute; top: 8px; right: 8px; padding: 7px 10px; background: #334155; font-size: .85rem; }
    #copyButton:hover { background: #475569; }
    .instruction { color: #334155; line-height: 1.6; }
    code { padding: 1px 4px; border-radius: 4px; background: #e2e8f0; }
    @media (max-width: 520px) { main { width: min(100% - 20px, 760px); margin: 10px auto; } header, form, .notice, .output { padding-left: 18px; padding-right: 18px; } #commandDisplay { padding: 48px 16px 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>폴더 링크 명령어 생성기</h1>
      <p>실행하지 않고, 검토 가능한 명령어만 생성합니다. 원본 폴더의 데이터는 변경하지 않습니다.</p>
    </header>

    <form id="linkForm" novalidate>
      <div class="field">
        <fieldset>
          <legend>운영체제</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="platform" value="windows" checked><span><strong>Windows</strong><small>명령 프롬프트(CMD)용 <code>mklink</code> 명령을 생성합니다.</small></span></label>
            <label class="choice"><input type="radio" name="platform" value="linux"><span><strong>Linux</strong><small>POSIX 셸용 <code>ln -s</code> 명령을 생성합니다.</small></span></label>
          </div>
        </fieldset>
      </div>

      <div class="field">
        <fieldset>
          <legend>연결 방식</legend>
          <div class="choices" id="linkTypes"></div>
        </fieldset>
      </div>

      <div class="field">
        <label for="sourcePath">원본 폴더 경로</label>
        <input id="sourcePath" type="text" spellcheck="false" autocomplete="off" required>
        <p class="hint" id="sourceHint"></p>
      </div>

      <div class="field">
        <label for="targetParentPath">링크를 만들 위치</label>
        <input id="targetParentPath" type="text" spellcheck="false" autocomplete="off" required>
        <p class="hint" id="targetParentHint"></p>
      </div>

      <div class="field">
        <label for="linkName">새 링크 폴더 이름</label>
        <input id="linkName" type="text" spellcheck="false" autocomplete="off" required>
        <p class="hint">원본 폴더 경로를 입력하면 마지막 폴더 이름을 자동으로 제안합니다. 필요하면 원하는 이름으로 바꾸세요.</p>
        <p class="path-preview" id="targetPreview">생성될 링크 경로: 입력 후 표시됩니다.</p>
      </div>

      <p class="error" id="errorMessage" role="alert" aria-live="assertive"></p>
      <button type="submit">명령어 생성</button>
    </form>

    <section class="notice" aria-labelledby="beforeRunTitle">
      <h2 id="beforeRunTitle">실행 전 반드시 확인</h2>
      <ul id="preflightList"></ul>
    </section>

    <section class="output" id="output" aria-live="polite" aria-labelledby="outputTitle">
      <h2 id="outputTitle">생성된 명령어</h2>
      <div class="command-wrap" id="commandWrap">
        <div id="commandDisplay" aria-hidden="true"></div>
        <span class="sr-only" id="commandText"></span>
        <button type="button" id="copyButton">복사</button>
      </div>
      <div class="instruction" id="instructions"></div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('linkForm');
      const platformRadios = [...document.querySelectorAll('input[name="platform"]')];
      const linkTypes = document.getElementById('linkTypes');
      const sourcePath = document.getElementById('sourcePath');
      const targetParentPath = document.getElementById('targetParentPath');
      const linkName = document.getElementById('linkName');
      const sourceHint = document.getElementById('sourceHint');
      const targetParentHint = document.getElementById('targetParentHint');
      const targetPreview = document.getElementById('targetPreview');
      const preflightList = document.getElementById('preflightList');
      const errorMessage = document.getElementById('errorMessage');
      const output = document.getElementById('output');
      const commandText = document.getElementById('commandText');
      const commandWrap = document.getElementById('commandWrap');
      const commandDisplay = document.getElementById('commandDisplay');
      const copyButton = document.getElementById('copyButton');
      const instructions = document.getElementById('instructions');

      const copy = {
        windows: [
          { value: 'symlink', title: '디렉터리 심볼릭 링크', detail: '원본의 위치를 가리키는 링크입니다. 개발자 모드 또는 관리자 권한이 필요할 수 있습니다.' },
          { value: 'junction', title: '디렉터리 정션 (Junction)', detail: 'Windows 전용 디렉터리 연결 방식입니다. 하드 링크가 아니며, 일반적으로 관리자 권한이 필요하지 않습니다.' }
        ],
        linux: [
          { value: 'symlink', title: '디렉터리 심볼릭 링크', detail: '원본의 위치를 가리키는 표준 Linux 링크입니다.' }
        ]
      };

      function platform() { return platformRadios.find(radio => radio.checked).value; }
      function selectedLinkType() { return document.querySelector('input[name="linkType"]:checked')?.value; }
      function addListItem(list, text) { const item = document.createElement('li'); item.textContent = text; list.appendChild(item); }
      function hasForbiddenControlCharacters(value) { return /[\u0000-\u001F\u007F]/.test(value); }
      function stripTrailingSeparators(value, currentPlatform) {
        const separator = currentPlatform === 'windows' ? /[\\/]+$/ : /\/+$/;
        return value.replace(separator, '');
      }
      function posixQuote(value) { return `'${value.replace(/'/g, `'"'"'`)}'`; }

      function renderForPlatform() {
        const currentPlatform = platform();
        linkTypes.replaceChildren();
        copy[currentPlatform].forEach((option, index) => {
          const label = document.createElement('label');
          label.className = 'choice';
          const radio = document.createElement('input');
          radio.type = 'radio'; radio.name = 'linkType'; radio.value = option.value; radio.checked = index === 0;
          const text = document.createElement('span');
          const title = document.createElement('strong'); title.textContent = option.title;
          const detail = document.createElement('small'); detail.textContent = option.detail;
          text.append(title, detail); label.append(radio, text); linkTypes.append(label);
        });
        const windows = currentPlatform === 'windows';
        sourcePath.placeholder = windows ? '예: E:\\ComfyUI\\models' : '예: /mnt/data/ComfyUI/models';
        targetParentPath.placeholder = windows ? '예: D:\\ComfyUI' : '예: /home/user/ComfyUI';
        linkName.placeholder = '예: models';
        sourceHint.textContent = windows ? '드라이브 문자 또는 UNC로 시작하는 절대 경로를 입력하세요.' : '/로 시작하는 절대 경로를 입력하세요.';
        targetParentHint.textContent = '새 링크 폴더를 만들 상위 위치를 입력하세요.';
        renderPreflight();
        renderTargetPreview();
        invalidateGeneratedCommand();
        errorMessage.textContent = '';
      }

      function renderPreflight() {
        const currentPlatform = platform();
        const linkType = selectedLinkType();
        preflightList.replaceChildren();
        addListItem(preflightList, '원본 폴더가 실제로 존재하는지 파일 탐색기 또는 터미널에서 먼저 확인하세요.');
        addListItem(preflightList, '새 링크 경로는 존재하면 안 됩니다. 이미 폴더나 링크가 있으면 중단하고 이름 또는 위치를 바꾸세요.');
        if (currentPlatform === 'windows' && linkType === 'symlink') addListItem(preflightList, 'Windows 심볼릭 링크는 개발자 모드 또는 관리자 권한이 필요할 수 있습니다.');
        if (currentPlatform === 'windows' && linkType === 'junction') addListItem(preflightList, '정션은 하드 링크가 아니며 Windows 전용입니다. 이동식·네트워크 경로에서는 기대와 다르게 동작할 수 있습니다.');
        if (currentPlatform === 'linux') addListItem(preflightList, '이 도구는 디렉터리 하드 링크를 제공하지 않습니다. Linux에서는 일반적으로 디렉터리 하드 링크를 만들 수 없습니다.');
        addListItem(preflightList, '생성된 명령은 검토 후 해당 운영체제의 터미널에서 직접 실행하세요. 이 페이지는 아무 명령도 실행하지 않습니다.');
      }

      function validatePath(value, currentPlatform, label) {
        if (!value) return `${label}를 입력하세요.`;
        if (hasForbiddenControlCharacters(value)) return `${label}에 줄바꿈 또는 제어 문자를 사용할 수 없습니다.`;
        if (currentPlatform === 'windows') {
          if (value.includes('"')) return `${label}에 큰따옴표(")를 사용할 수 없습니다.`;
          if (!/^(?:[A-Za-z]:[\\/]|\\\\)/.test(value)) return `${label}은 드라이브 문자 또는 UNC로 시작하는 절대 경로여야 합니다.`;
          if (/[<>:"|?*]/.test(value.replace(/^[A-Za-z]:/, ''))) return `${label}에 Windows에서 사용할 수 없는 문자가 있습니다.`;
          if (/[. ]$/.test(value)) return `${label}은 점 또는 공백으로 끝날 수 없습니다.`;
        } else if (!value.startsWith('/')) {
          return `${label}은 /로 시작하는 절대 경로여야 합니다.`;
        }
        return '';
      }

      function validateLinkName(value, currentPlatform) {
        if (!value) return '새 링크 폴더 이름을 입력하세요.';
        if (hasForbiddenControlCharacters(value)) return '새 링크 폴더 이름에 줄바꿈 또는 제어 문자를 사용할 수 없습니다.';
        if (value === '.' || value === '..') return '새 링크 폴더 이름으로 . 또는 ..을 사용할 수 없습니다.';
        if (/[\\/]/.test(value)) return '새 링크 폴더 이름에는 경로 구분 기호(/ 또는 \\)를 사용할 수 없습니다.';
        if (currentPlatform === 'windows') {
          if (/[<>:"|?*]/.test(value)) return 'Windows 링크 이름에 사용할 수 없는 문자가 있습니다.';
          if (/[. ]$/.test(value)) return 'Windows 링크 이름은 점 또는 공백으로 끝날 수 없습니다.';
          if (/^(?:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\..*)?$/i.test(value)) return 'Windows 예약 장치 이름은 링크 이름으로 사용할 수 없습니다.';
        }
        return '';
      }

      function suggestLinkName() {
        if (linkName.dataset.userEdited === 'true') return;
        const suggested = sourcePath.value.trim().replace(/[\\/]+$/, '').split(/[\\/]/).pop();
        if (suggested && suggested !== '.' && suggested !== '..') linkName.value = suggested;
      }

      function makeTargetPath(parent, name, currentPlatform) {
        const separator = currentPlatform === 'windows' ? '\\' : '/';
        return `${parent.replace(/[\\/]+$/, '')}${separator}${name}`;
      }

      function renderTargetPreview() {
        const currentPlatform = platform();
        const parent = targetParentPath.value.trim();
        const name = linkName.value.trim();
        if (!parent || !name) {
          targetPreview.textContent = '생성될 링크 경로: 입력 후 표시됩니다.';
          return;
        }
        if (validatePath(parent, currentPlatform, '링크를 만들 위치') || validateLinkName(name, currentPlatform)) {
          targetPreview.textContent = '생성될 링크 경로: 올바른 위치와 이름을 입력하세요.';
          return;
        }
        targetPreview.textContent = `생성될 링크 경로: ${makeTargetPath(parent, name, currentPlatform)}`;
      }

      function invalidateGeneratedCommand() {
        output.style.display = 'none';
        copyButton.textContent = '복사';
      }

      function makeCommand(source, target, currentPlatform, linkType) {
        if (currentPlatform === 'linux') return `ln -s -- ${posixQuote(source)} ${posixQuote(target)}`;
        return linkType === 'junction'
          ? `mklink /J "${target}" "${source}"`
          : `mklink /D "${target}" "${source}"`;
      }

      function instructionText(currentPlatform, linkType) {
        if (currentPlatform === 'linux') return '터미널에 붙여넣어 실행하세요. 원본과 링크 경로는 모두 절대 경로이며, 링크 경로는 존재하지 않아야 합니다.';
        if (linkType === 'junction') return '명령 프롬프트(CMD)에 붙여넣어 실행하세요. 링크 경로가 이미 존재하면 실행하지 말고 먼저 정리 여부를 확인하세요.';
        return '개발자 모드를 켜거나 필요한 경우 관리자 권한으로 명령 프롬프트(CMD)를 열어 붙여넣어 실행하세요.';
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const currentPlatform = platform();
        const source = sourcePath.value.trim();
        const targetParent = targetParentPath.value.trim();
        const name = linkName.value.trim();
        const sourceError = validatePath(source, currentPlatform, '원본 폴더 경로');
        const targetParentError = validatePath(targetParent, currentPlatform, '링크를 만들 위치');
        const nameError = validateLinkName(name, currentPlatform);
        const target = !targetParentError && !nameError ? makeTargetPath(targetParent, name, currentPlatform) : '';
        const comparableSource = currentPlatform === 'windows' ? stripTrailingSeparators(source, currentPlatform).toLowerCase() : stripTrailingSeparators(source, currentPlatform);
        const comparableTarget = currentPlatform === 'windows' ? stripTrailingSeparators(target, currentPlatform).toLowerCase() : stripTrailingSeparators(target, currentPlatform);
        const samePath = !sourceError && !targetParentError && !nameError && comparableSource === comparableTarget;
        errorMessage.textContent = sourceError || targetParentError || nameError || (samePath ? '원본 폴더와 새 링크 경로는 서로 달라야 합니다.' : '');
        if (errorMessage.textContent) { output.style.display = 'none'; return; }
        commandText.textContent = makeCommand(source, target, currentPlatform, selectedLinkType());
        commandDisplay.textContent = commandText.textContent;
        instructions.textContent = instructionText(currentPlatform, selectedLinkType());
        output.style.display = 'block';
        copyButton.textContent = '복사';
      });

      async function copyCommand() {
        const value = commandText.textContent;
        if (!value) return;
        try {
          if (navigator.clipboard?.writeText && window.isSecureContext) await navigator.clipboard.writeText(value);
          else {
            const textArea = document.createElement('textarea');
            textArea.value = value; textArea.setAttribute('readonly', '');
            textArea.style.cssText = 'position:fixed;opacity:0;'; document.body.append(textArea);
            textArea.select();
            const copied = document.execCommand('copy'); textArea.remove();
            if (!copied) throw new Error('copy failed');
          }
          copyButton.textContent = '복사 완료';
        } catch {
          copyButton.textContent = '복사 실패';
        }
        window.setTimeout(() => { copyButton.textContent = '복사'; }, 2000);
      }

      platformRadios.forEach(radio => radio.addEventListener('change', renderForPlatform));
      linkTypes.addEventListener('change', () => { renderPreflight(); invalidateGeneratedCommand(); });
      sourcePath.addEventListener('input', () => { suggestLinkName(); renderTargetPreview(); invalidateGeneratedCommand(); });
      targetParentPath.addEventListener('input', () => { renderTargetPreview(); invalidateGeneratedCommand(); });
      linkName.addEventListener('input', () => { linkName.dataset.userEdited = 'true'; renderTargetPreview(); invalidateGeneratedCommand(); });
      copyButton.addEventListener('click', copyCommand);
      renderForPlatform();
    })();
  </script>
</body>
</html>
